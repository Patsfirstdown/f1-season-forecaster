<!DOCTYPE html>
<html>
    <head>
        <!--Professional Website-->
        <title>F1 Forecast Dashboard</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <head class="mainHeader">
            <ul class="nav">
                <li>
                    <a class="header" href="https://google.com">Google</a>
                </li>
                <li>
                    <a class="header" href="https://google.com" align="left">Google</a>
                </li>
                <li>
                    <a class="header" href="https://google.com" align="center">Google</a>
                </li>
                <li>
                    <a class="right_link" href="https://google.com" align="right">Google</a>
                </li>
            </ul>
        </head>
        <div>
            <header class="welcome">
                <h1>F1 Forecaster Dashboard</h1>
            </header>
        </div>
        <div>
            <table class="dropdown_table">
                <theader>
                    <tr>
                        
                    </tr>
                </theader>
                    <tr>
                        <td>
                            <td align="Right">Year</td>
                        <td>
                            <!--
                            Year list
                            -->
                            <label for="year_picked"></label>
                            <select id="yearSelect" name="year_picked" required>
                                <option value="ERRORBADNOEVILDONTDOTHISONE">Please Select Year</option>
                                <option value="2026">2026</option>
                        </td>
                        <td>
                            <span type="year_picked" id="year_pickedError"></span>
                        </td>
                        <td>
                            <td align="Right">Race</td>
                        <td>
                            <!--
                            Driver list
                            -->
                            <label for="race"></label>
                            <select id="raceSelect" name="race" required>
                                <option value="ERRORBADNOEVILDONTDOTHISONE">Please Select Race</option>
                        </td>
                        <td>
                            <span type="race" id="raceError"></span>
                        </td>
                        <td align="Right">Driver</td>
                        <td>
                            <!--
                            Driver list
                            -->
                            <label for="driver"></label>
                            <select id="driverSelect" name="driver" required>
                                <option value="ERRORBADNOEVILDONTDOTHISONE">Please Select Driver</option>
                        </td>
                        <td>
                            <span type="error" id="driverError"></span>
                        </td>
                    </tr>
            </table>
        </div>
        <div id="graph-container" class="graph-container">
            <p>Select filters to generate graphs</p>
        </div>
        <div>
            <table class="footerForm">
                <theader>
                    <tr>
                        <td>
                            <a href="https://www.instagram.com">Instagram</a>
                        </td>
                        <td>

                        </td>
                    </tr>
                </theader>
            </table>
        </div>
