<!DOCTYPE html>
<html>
    <head>
        <!--Professional Website-->
        <title>F1 Forecast Dashboard</title>
        <link rel="stylesheet" href="styles.css">
        <script src="common.js"></script>
        <script src="dashboard.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body>
        <div id="mainHeader" class="mainHeader">
        </div>
        <div>
            <header class="welcome" style="border-bottom: 32px solid var(--f1_silver)">
                <h1>F1 Forecaster Dashboard</h1>
            </header>
        </div>
        <div class="description">
            <table class="description">
                <thead>
                    <th colspan="4" style="border-bottom:2px solid var(--f1_red)">
                        Graph Tips
                    </th>
                </thead>
                <tr>
                    <td>
                        Single Click: Hide Driver
                    </td>
                    <td>
                        Windows: Ctrl Click: Show Only Driver
                    </td>
                    <td>
                        Mac: Cmd Click: Show Only Driver
                    </td>
                    <td>
                        Ctrl/Cmd Click Again: Show All Drivers
                    </td>
                </tr>
            </table>
        </div>
        <div class="homeDisplay">
            <table class="tableDisplay">
                <tr class="rowDisplay">
                    <td class="graph-thing">
                        Race:
                    </td>
                        <td class="dashCol">
                        <canvas id="raceChart" class="dashChart"></canvas>
                    </td>
                </tr>
                <tr class="rowDisplay">
                    <td class="graph-thing">
                        WDC:
                    </td>
                    <td class="dashCol">
                        <canvas id="wdcChart" class="dashChart"></canvas>
                    </td>
                </tr>
                <tr class="rowDisplay">
                    <td class="graph-thing">
                        WCC:
                    </td>
                    <td class="dashCol">
                        <canvas id="wccChart" class="dashChart"></canvas>
                    </td>
                </tr>
            </table>
        </div>
        <div id="footerForm">
        </div>
    </body>
</html>
