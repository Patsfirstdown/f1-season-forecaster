        <head class="mainHeader">
            <ul class="nav">

                    <a class="header" href="https://patsfirstdown.github.io/f1-season-forecaster/Dashboard/driver_race" align="right">Race</a>

            </ul>
        </head>
        <div>
            <header class="banner">
                <h1>Forecast Analysis</h1>
            </header>
        </div>
        <div>
            <table class="dropdown_table">
                <theader>
                    <tr>
                        
                    </tr>
                </theader>
                    <tr>
                        <td>
                            <td align="Right">Year</td>
                        <td>
                            <!--
                            Year list
                            -->
                            <label for="year_picked"></label>
                            <select class="select-box" id="yearSelect" name="year_picked" required>
                                <option value="2026">2026</option>
                        </td>
                        <td>
                            <span type="year_picked" id="year_pickedError"></span>
                        </td>
                        <td>
                            <td align="Right">Race</td>
                        <td>
                            <!--
                            Driver list
                            -->
                            <label for="race"></label>
                            <select class="select-box" id="raceSelect" name="race" required>
                        </td>
                        <td>
                            <span type="race" id="raceError"></span>
                        </td>
                        <td align="Right">Driver 1</td>
                        <td>
                            <!--
                            Driver list
                            -->
                            <label for="driver1"></label>
                            <select class="select-box" id="driverSelect1" name="driver1" required>
                        </td>
                        <td>
                            <span type="error" id="driverError1"></span>
                        </td>
                        <td align="Right">Driver 2</td>
                        <td>
                            <!--
                            Driver list
                            -->
                            <label for="driver1"></label>
                            <select class="select-box" id="driverSelect2" name="driver2" required>
                        </td>
                        <td>
                            <span type="error" id="driverError2"></span>
                        </td>
                        <td class="button">
                            <button class="submit-btn" id="generateDriverButton" type="submit" align="right">Load Data</button>
                        </td>
                    </tr>
            </table>
        </div>
        <div class="dashboard_card">

            <h3>Driver Comparison</h3>
        
            <div id="comparisonResults"></div>
        
        </div>
        <div>
            <div>
                <canvas id="expected-scatter"></canvas>
            </div>
        </div>
        <div>
            <table class="footerForm">
                <theader>
                    <tr>
                        <td>
                            <a class="footerForm" href="https://www.instagram.com/jayden.pickin.official">Instagram</a>
                        </td>
                        <td>
                            <a class="footerForm" href="https://linkedin.com/in/jayden-pickin">LinkedIn</a>

                    </tr>
